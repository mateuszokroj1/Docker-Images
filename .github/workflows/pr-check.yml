name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build-on-linux:
    strategy:
      matrix:
       image-path: [base-images/linux-amd64-vcpkg]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      name: Git Checkout
      
    - name: Build the Docker image
      working-directory: ${{ matrix.image-path }}
      run: docker build .

  build-on-windows:
    strategy:
      matrix:
        image-path: [base-images/win/WinServer-Amd64-MSVC-Vcpkg]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7.0.1
      name: Git Checkout
    
    - name: Build the Docker Image
      working-directory: ${{ matrix.image-path }}
      run: docker build .
