name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

  build-on-linux:
    strategy:
      matrix:
       image-path: [base-images/linux-amd64-vcpkg]

    environment:
      name: prod

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      name: Git Checkout

    - name: Docker Login
    # You may pin to the exact commit or the version.
    # uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      uses: docker/login-action@v4.7.0
      with:
        # Username used to log against the Docker registry
        username: ${{ secrets.DOCKER_USERNAME }}
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_PASS }}

  #  - name: Docker Setup Buildx
      # You may pin to the exact commit or the version.
      # uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
  #    uses: docker/setup-buildx-action@v4.4.1
  #    with:
   #     driver-opts: image=moby/buildkit:v0.34.2

    - name: Read tags info
      id: tags_json
      uses: ActionsTools/read-json-action@main
      with:
        file_path: ${{ matrix.image-path }}/tags.json

    - name: Build Docker images
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
   #   uses: docker/build-push-action@v7.4.0
   #   with:
    #    file: ${{ matrix.image-path }}/Dockerfile
        # Always attempt to pull all referenced images
     #   pull: false
        # Push is a shorthand for --output=type=registry
     #   push: false
      working-directory: ${{ matrix.image-path }}
      run: docker build -t ${{ steps.tags_json.outputs.primary-tag }} .

    -   name: Docker Scout
        id: docker-scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.tags_json.outputs.primary-tag }}
          ignore-unchanged: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-on-windows:
    strategy:
      matrix:
        image-path: [base-images/win/WinServer-Amd64-MSVC-Vcpkg]

    environment:
      name: prod

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7.0.1
      name: Git Checkout

    - name: Docker Login
    # You may pin to the exact commit or the version.
    # uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      uses: docker/login-action@v4.7.0
      with:
        # Username used to log against the Docker registry
        username: ${{ secrets.DOCKER_USERNAME }}
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_PASS }}

    - name: Read tags info
      id: tags_json
      uses: ActionsTools/read-json-action@main
      with:
        file_path: ${{ matrix.image-path }}/tags.json

 #   - name: Docker Setup Buildx
      # You may pin to the exact commit or the version.
      # uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
 #     uses: docker/setup-buildx-action@v4.4.1
  #    with:
    #    driver-opts: image=moby/buildkit:v0.34.2
    
    - name: Build Docker images
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
  #    uses: docker/build-push-action@v7.4.0
  #    with:
  #      file: ${{ matrix.image-path }}/Dockerfile
        # Always attempt to pull all referenced images
   #     pull: false
        # Push is a shorthand for --output=type=registry
   #     push: false
      working-directory: ${{ matrix.image-path }}
      run: docker build -t ${{ steps.tags_json.outputs.primary-tag }} .

    -   name: Docker Scout
        id: docker-scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.tags_json.outputs.primary-tag }}
          ignore-unchanged: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
