name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build-on-linux:
    strategy:
      matrix:
       image-path: [base-images/linux-amd64-vcpkg]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      name: Git Checkout
      
    - name: Build Docker images
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
        file: ${{ matrix.image-path }}/Dockerfile
        # Always attempt to pull all referenced images
        pull: false
        # Push is a shorthand for --output=type=registry
        push: false

  build-on-windows:
    strategy:
      matrix:
        image-path: [base-images/win/WinServer-Amd64-MSVC-Vcpkg]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7.0.1
      name: Git Checkout
    
    - name: Build Docker images
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
        file: ${{ matrix.image-path }}/Dockerfile
        # Always attempt to pull all referenced images
        pull: false
        # Push is a shorthand for --output=type=registry
        push: false
