# This is a basic workflow that is manually triggered

name: Build all Docker images

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
    
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  docker-build:

    strategy:
       matrix:
         runner:
         - windows-latest
         - ubuntu-latest
         include:
         - image: ./base-images/linux-amd64-vcpkg
           runner: ubuntu-latest
           tag: linux-amd64-vcpkg-base
         - image: ./qt/linux-amd64-vcpkg-qt6
           runner: ubuntu-latest
           tag: linux-amd64-vcpkg-qt6
         - image: ./base-images/win/WinServer-Amd64-Vcpkg
           runner: windows-latest
           tag: WinServer-Amd64-Vcpkg-base
  
    # The type of runner that the job will run on
    runs-on: ${{ matrix.runner }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    - name: Git Checkout
      uses: actions/checkout@v4.2.2
    
    # Runs a single command using the runners shell
    - name: Docker Build
      shell: sh
      working-directory: ${{ matrix.image }}
      run: docker build --build-arg GITHUB_TOKEN=$GITHUB_TOKEN -t mateuszokroj1/${{ matrix.tag }} .
